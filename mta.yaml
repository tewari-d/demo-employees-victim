_schema-version: 3.3.0
ID: demo-employees
description: A simple CAP project.
version: 1.0.0

modules:
  - name: demo-employees-srv
    type: nodejs
    path: gen/srv
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
    requires:
      - name: demo-employees-auth
      - name: demo-employees-db
      - name: demo-employees-connectivity
      - name: demo-employees-destination

  - name: demo-employees-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: demo-employees-db
    parameters:
      buildpack: nodejs_buildpack

  - name: demo-employees
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: demo-employees-auth
      - name: demo-employees-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: demo-employees-destination-content
    type: com.sap.application.content
    requires:
      - name: demo-employees-destination
        parameters:
          content-target: true
      - name: demo-employees-repo-host
        parameters:
          service-key:
            name: demo-employees-repo-host-key
      - name: demo-employees-auth
        parameters:
          service-key:
            name: demo-employees-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: demo-employees-approuter_html_repo_host
              ServiceInstanceName: demo-employees-html5-service
              ServiceKeyName: demo-employees-repo-host-key
              sap.cloud.service: demo-employees
            - Authentication: OAuth2UserTokenExchange
              Name: demo-employees-approuter_auth
              ServiceInstanceName: demo-employees-auth
              ServiceKeyName: demo-employees-auth-key
              sap.cloud.service: demo-employees
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  - name: demo-employees-app-content
    type: com.sap.application.content
    path: app/
    requires:
      - name: demo-employees-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - employeeuiapp.zip
          name: employeeuiapp
          target-path: resources/

  - name: employeeuiapp
    type: html5
    path: app/employee_ui_app
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []
    requires: 
      - name: demo-employees-repo-host

resources:
  - name: demo-employees-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: demo-employees-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application

  - name: demo-employees-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: demo-employees-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: demo-employees-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-name: demo-employees-destination-service
      service-plan: lite

  - name: demo-employees-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: demo-employees-html5-service
      service-plan: app-host

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
